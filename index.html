<!DOCTYPE html>
<html>
<head>
  <title>Exodus Accounts App Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
    }

    .container {
      display: flex;
      width: 900px;
      height: 500px;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    /* LEFT SIDE */
    .left {
      width: 50%;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .left h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .left p {
      color: gray;
      margin-bottom: 20px;
    }

    input {
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ddd;
      width: 100%;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #7b2ff7, #f107a3);
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      opacity: 0.9;
    }

    #msg {
      margin-top: 10px;
      color: red;
    }

    /* RIGHT SIDE */
    .right {
      width: 50%;
      background: linear-gradient(135deg, #7b2ff7, #f107a3);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .right h2 {
      font-size: 24px;
    }

    @media(max-width: 768px) {
      .container {
        flex-direction: column;
        width: 90%;
        height: auto;
      }
      .left, .right {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="left">
    <h1>Welcome</h1>
    <p>Login to download Exodus Accounts app</p>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Sign In</button>

    <p id="msg"></p>
  </div>

  <!-- RIGHT -->
 <div class="right">
  <img src="your-image.jpg" style="width:80%;">
</div>

</div>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA13himKci_pmP583-UtnpixWM8btApUAw",
  authDomain: "exo-projects.firebaseapp.com"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(() => {
      window.location.href = "download.html";
    })
    .catch((error) => {
      document.getElementById("msg").innerText = error.message;
    });
}
</script>

</body>
</html>
