<!DOCTYPE html>
<html>
<head>
  <title>Download App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
    }

    .container {
      text-align: center;
      background: rgba(255,255,255,0.1);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      width: 320px;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 30px;
      font-size: 14px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      font-size: 15px;
    }

    .android {
      background: #3ddc84;
      color: black;
    }

    .ios {
      background: #000;
      color: white;
    }

    .mac {
      background: #999;
      color: white;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Download Exodus Accounts App</h2>
  <p>Select your device to continue</p>

  <a href="https://drive.google.com/file/d/1V3wB_-FlZOCaNkh_s-KLasXkQPYzS4G7/view?usp=sharing">
    <button class="btn android">📱 Download for Android</button>
  </a>

  <a href="https://drive.google.com/file/d/1yyAC7RIkzWRFu6M4LLONJ1tu5iPf1gOP/view?usp=sharing">
    <button class="btn ios">🍎 Download for iOS</button>
  </a>

  <a href="https://drive.google.com/file/d/1KeYRAKrHEmYNTjLVz81u5P8M1enmE5CX/view?usp=sharing">
    <button class="btn mac">💻 Download for macOS</button>
  </a>
  <div style="margin-top:25px; font-size:13px; color:#eee; text-align:left;">
  <strong>Note:</strong>
  <ul style="margin-top:8px; padding-left:18px;">
    <li>For iOS Installation, you must have Xcode Application in your macOS.</li>
    <li>Please do registration with your email ID and create a new password for first-time login.</li>
  </ul>
</div>

</div>

</body>
</html>
